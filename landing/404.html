<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Открыть группу</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 48px auto; padding: 0 16px; text-align: center; color: #1a1a1a; }
    button { font-size: 18px; padding: 14px 28px; border: 0; border-radius: 10px; background: #1a73e8; color: #fff; cursor: pointer; }
    p { margin: 16px 0; }
    .hint { font-size: 14px; color: #666; }
    a { color: #1a73e8; }
  </style>
</head>
<body>
  <h2>Приглашение в группу GroupFund</h2>
  <p>Сейчас откроем приложение. Если ничего не произошло — нажмите кнопку:</p>
  <p><button id="open">Открыть в приложении</button></p>
  <p class="hint">Если приложение не установлено или кнопка не работает — скачайте его и попробуйте снова, либо установите из Google Play.</p>
  <script>
    if (location.pathname.indexOf('/invite/') !== 0) {
      document.querySelector('h2').textContent = 'Страница не найдена';
      document.querySelector('p').textContent = 'Вернитесь к приглашению, либо проверьте ссылку.';
      document.getElementById('open').style.display = 'none';
    } else {
      var m = location.pathname.match(/^\/invite\/([^/]+)\/?$/);
      var id = m ? decodeURIComponent(m[1]) : '';
      var appUrl = id ? 'groupfund://invite/' + id : null;
      function tryOpen() { if (appUrl) { window.location = appUrl; } }
      window.addEventListener('load', function () { if (appUrl) { setTimeout(tryOpen, 400); } });
      document.getElementById('open').addEventListener('click', tryOpen);
    }
  </script>
</body>
</html>
